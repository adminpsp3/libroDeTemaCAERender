<!-- Backdrop & Scroll Container -->
<div id="edit-modal-container" class="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6 bg-slate-900/60 backdrop-blur-sm" onclick="closeEditModal(event)">
    <!-- Modal Content: Compact & Scrollable -->
    <div class="relative bg-white rounded-[1.5rem] shadow-2xl w-full max-w-lg max-h-[85vh] flex flex-col overflow-hidden transform transition-all border border-slate-200" onclick="event.stopPropagation()">
        
        <!-- Header: Minimal & Dark -->
        <div class="bg-[#1E293B] py-5 px-8 flex justify-between items-center text-white shrink-0">
            <div>
                <h3 class="text-lg font-semibold tracking-tight">Editar Registro</h3>
                <p class="text-[10px] text-slate-400 font-medium uppercase tracking-[0.2em] mt-0.5">Clase de {{ registro.dia_semana }}</p>
            </div>
            <button onclick="closeEditModal()" class="text-slate-400 hover:text-white transition-all p-1">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
        </div>

        <!-- Form Area: Scrollable -->
        <div class="flex-1 overflow-y-auto p-8 custom-scrollbar bg-white">
            <form id="edit-record-form" 
                hx-post="/libros/registro/{{ registro.id }}/edit" 
                hx-target="#registro-{{ registro.id }}" 
                hx-swap="outerHTML"
                hx-on::after-request="if(event.detail.successful) closeEditModal()"
                class="space-y-6">
                <!-- Fecha de Clase -->
                <div>
                    <label class="block text-[11px] font-medium text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Fecha de la Clase</label>
                    <input type="date" name="fecha_clase" value="{{ registro.fecha_clase.isoformat() }}" required
                        class="w-full px-5 py-3 rounded-xl border border-slate-100 bg-slate-50 focus:bg-white focus:ring-4 focus:ring-blue-500/5 focus:border-blue-400 outline-none transition-all text-sm text-slate-700 font-medium shadow-sm">
                </div>

                <!-- Contenidos -->
                <div>
                    <label class="block text-[11px] font-medium text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Contenidos / Tema</label>
                    <textarea name="contenidos" rows="4" required
                        class="w-full px-5 py-3 rounded-2xl border border-slate-100 bg-slate-50 focus:bg-white focus:ring-4 focus:ring-blue-500/5 focus:border-blue-400 outline-none transition-all text-sm text-slate-700 font-medium resize-none leading-relaxed shadow-sm">{{ registro.contenidos }}</textarea>
                </div>

                <!-- Actividades -->
                <div>
                    <label class="block text-[11px] font-medium text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Propuesta / Actividades</label>
                    <textarea name="actividades" rows="4"
                        class="w-full px-5 py-3 rounded-2xl border border-slate-100 bg-slate-50 focus:bg-white focus:ring-4 focus:ring-blue-500/5 focus:border-blue-400 outline-none transition-all text-sm text-slate-700 font-medium resize-none leading-relaxed shadow-sm">{{ registro.actividades or '' }}</textarea>
                </div>

                <!-- Observaciones -->
                <div>
                    <label class="block text-[11px] font-medium text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Observaciones</label>
                    <textarea name="observaciones" rows="3"
                        class="w-full px-5 py-3 rounded-2xl border border-slate-100 bg-slate-50 focus:bg-white focus:ring-4 focus:ring-blue-500/5 focus:border-blue-400 outline-none transition-all text-sm text-slate-700 font-medium resize-none leading-relaxed shadow-sm">{{ registro.observaciones or '' }}</textarea>
                </div>
            </form>
        </div>

        <!-- Footer: Fixed -->
        <div class="p-6 bg-slate-50 border-t border-slate-100 flex space-x-3 shrink-0">
            <button type="button" onclick="closeEditModal()" 
                class="flex-1 py-3.5 bg-white text-slate-400 text-xs font-semibold uppercase tracking-widest rounded-xl border border-slate-200 hover:bg-slate-100 transition-all active:scale-95 leading-none shadow-sm">
                Descartar
            </button>
            <button type="submit" form="edit-record-form"
                class="flex-1 py-3.5 bg-[#0F172A] text-white text-xs font-semibold uppercase tracking-widest rounded-xl hover:bg-slate-800 shadow-xl shadow-slate-200 transition-all active:scale-95 leading-none">
                Guardar Cambios
            </button>
        </div>
    </div>
</div>

<style>
    .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f5f9;
        border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 10px;
        border: 2px solid #f1f5f9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: #94a3b8;
    }
</style>

<script>
    function closeEditModal(event) {
        if (!event || event.target.id === 'edit-modal-container') {
            const el = document.getElementById('edit-modal-container');
            if (el) el.remove();
        }
    }
    
    // Auto-close on escape
    document.addEventListener('keydown', function(evt) {
        if (evt.key === 'Escape') {
            const el = document.getElementById('edit-modal-container');
            if (el) el.remove();
        }
    });
</script>
