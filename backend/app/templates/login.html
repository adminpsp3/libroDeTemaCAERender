<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso3 - Libro de Temas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4 { font-family: 'Poppins', sans-serif; font-weight: 500; }
        .font-bold, .font-black, .font-extrabold { font-family: 'Poppins', sans-serif; font-weight: 600; }
    </style>
</head>
<body class="bg-[#F8FAFC] min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-10 rounded-xl shadow-[0_20px_50px_rgba(0,0,0,0.05)] w-full max-w-md border border-gray-100">
        <!-- Logo Institucional -->
        <div class="flex justify-center mb-10">
            <img src="https://escuelacae.edu.ar/wp-content/uploads/2017/11/Escudo_Esc_CAE.png" alt="Escudo CAE" class="h-24 w-auto drop-shadow-sm">
        </div>

        <h1 class="text-2xl font-bold text-slate-800 text-center mb-1 tracking-tight">Libro de Temas</h1>
        <p class="text-slate-400 text-center mb-10 text-sm font-medium">Gestión Pedagógica Digital</p>

        <form hx-post="/login" hx-target="#error-container" hx-swap="innerHTML" class="space-y-6">
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Correo electrónico</label>
                <input type="email" name="email" required
                    class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-4 focus:ring-slate-100 focus:border-slate-400 transition-all text-slate-700 placeholder-slate-300 bg-slate-50/50"
                    placeholder="docente@escuela.edu.ar">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">DNI</label>
                <div class="relative">
                    <input type="password" name="dni" id="dni-input" required
                        class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-4 focus:ring-slate-100 focus:border-slate-400 transition-all text-slate-700 placeholder-slate-300 bg-slate-50/50"
                        placeholder="Número de DNI">
                    <button type="button" onclick="toggleDni()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-300 hover:text-slate-600 transition-colors focus:outline-none">
                        <svg id="eye-icon" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg id="eye-off-icon" class="h-5 w-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                        </svg>
                    </button>
                </div>
            </div>

            <div id="error-container"></div>

            <button type="submit" id="submit-button"
                class="w-full bg-slate-900 text-white py-3.5 rounded-lg font-bold hover:bg-black shadow-lg shadow-slate-200 transition-all flex items-center justify-center space-x-2 active:scale-[0.98]">
                <span id="spinner" class="hidden animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"></span>
                <span id="button-text">Ingresar al sistema</span>
            </button>
        </form>
    </div>

    <script>
        function toggleDni() {
            const input = document.getElementById('dni-input');
            const eyeIcon = document.getElementById('eye-icon');
            const eyeOffIcon = document.getElementById('eye-off-icon');
            if (input.type === 'password') {
                input.type = 'text';
                eyeIcon.classList.add('hidden');
                eyeOffIcon.classList.remove('hidden');
            } else {
                input.type = 'password';
                eyeIcon.classList.remove('hidden');
                eyeOffIcon.classList.add('hidden');
            }
        }

        // Logic to show spinner and disable button on HTMX request
        document.body.addEventListener('htmx:beforeRequest', function(evt) {
            const btn = document.getElementById('submit-button');
            const btnText = document.getElementById('button-text');
            const spinner = document.getElementById('spinner');
            
            if (btn) {
                btn.disabled = true;
                btnText.innerText = 'Verificando...';
                spinner.classList.remove('hidden');
            }
        });

        document.body.addEventListener('htmx:afterRequest', function(evt) {
            const btn = document.getElementById('submit-button');
            const btnText = document.getElementById('button-text');
            const spinner = document.getElementById('spinner');
            
            // Only reset if there's no redirect (meaning there was an error)
            if (btn && !evt.detail.xhr.getResponseHeader('HX-Redirect')) {
                btn.disabled = false;
                btnText.innerText = 'Ingresar al sistema';
                spinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
